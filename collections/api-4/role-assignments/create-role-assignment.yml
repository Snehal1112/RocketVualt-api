docs: |-
  ## Create Role Assignment

  Grants an Azure-style role to a principal in this vault.

  | Field | Value |
  | --- | --- |
  | Method | `POST` |
  | Path | `/api/v1/vaults/{vault_name}/role-assignments` |
  | Auth | Requires a valid bearer token and permission to manage role assignments in this vault (global `admin`, a vault-scoped `vaults:manage` grant, or `Key Vault Data Access Administrator`). |

  **Parameters**

  - `vault_name` (path): Name of the vault.

  **Request body**

  ```json
  {
    "principal": "{{user_id}}",
    "principal_type": "{{principal_type}}",
    "role": "{{vault_role}}"
  }
  ```

  **Notes**

  Non-admin callers can grant only the roles they are allowed to grant.
