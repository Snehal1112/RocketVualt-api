docs: |-
  # Delete Key

  `DELETE {{base_url}}/api/v1/vaults/{{vault_name}}/keys/{{key_id}}`

  Deletes a key.

  ## Requires
  - `key_id`: the key to delete.

  ## Auth
  Bearer `{{token}}`.

  ## Notes
  - The collection has a `soft-delete` folder with requests to list, restore, and purge deleted keys. Check whether this deletion is recoverable there.
  - Deleting a key may stop encrypt, decrypt, sign, and other operations that use it. Confirm before running against shared environments.
