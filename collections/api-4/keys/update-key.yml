docs: |-
  # Update Key

  `PUT {{base_url}}/api/v1/vaults/{{vault_name}}/keys/{{key_id}}`

  Changes a key's name and tags.

  ## Requires
  - `key_id`: the key to update.

  ## Auth
  Bearer `{{token}}`.

  ## Body (JSON)
  - `name` (string): new name.
  - `tags` (string[]): new tags. The example changes `env:dev` to `env:prod`.

  ## Notes
  - The request body sends both fields. Check whether omitted fields are left unchanged before sending only one of them.
