docs: |-
  # Delete Key Rotation Policy

  `DELETE {{base_url}}/api/v1/vaults/{{vault_name}}/keys/{{key_id}}/rotationpolicy`

  Removes the rotation policy of a key. The key itself is not deleted.

  ## Requires
  - `key_id`.

  ## Auth
  Bearer `{{token}}`.
