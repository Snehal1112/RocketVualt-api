docs: |-
  # Decrypt Key

  `POST {{base_url}}/api/v1/vaults/{{vault_name}}/keys/{{key_id}}/decrypt`

  Decrypts data that was encrypted with the key.

  ## Requires
  - `key_id`.

  ## Auth
  Bearer `{{token}}`.

  ## Body (JSON)
  - `value` (string): base64-encoded ciphertext.
  - `nonce` (string): base64-encoded nonce. The body comment refers to AES-256-GCM.
  - `algorithm` (string): the example uses `RSA-OAEP`.

  ## Notes
  - **Confirm the algorithm before use.** The `nonce` field refers to AES-256-GCM, but `algorithm` is `RSA-OAEP`. Check which one the server expects.
  - The response field names are not confirmed. The test only checks for a non-empty JSON object, status 200, JSON content type, and a response time under 2000 ms.
