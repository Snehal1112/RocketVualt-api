    type: bearer
    token: '{{token}}'
docs: |-
  # Verify Key

  `POST {{base_url}}/api/v1/vaults/{{vault_name}}/keys/{{key_id}}/verify`

  Checks that a signature matches the data.

  ## Requires
  - `key_id`.

  ## Auth
  Bearer `{{token}}`.

  ## Body (JSON)
  - `value` (string): base64-encoded original data.
  - `signature` (string): base64-encoded signature, from Sign Key.
  - `algorithm` (string): the example uses `RS256`. It must match the algorithm used to sign.
