docs: |-
  ## Verify Key

  Verifies a signature that was created with a key.

  | Field | Value |
  | --- | --- |
  | Method | `POST` |
  | Path | `/api/v1/vaults/{vault_name}/keys/{key_id}/verify` |
  | Auth | Requires a valid bearer token and a role assignment in this vault that grants the matching data action. The global `admin` role does not bypass this check. |

  **Parameters**

  - `vault_name` (path): Name of the vault.
  - `key_id` (path): UUID of the key.

  **Request body**

  ```json
  {
    "value": "<base64-encoded-original-data>",
    "signature": "<base64-encoded-signature>",
    "algorithm": "RS256"
  }
  ```
