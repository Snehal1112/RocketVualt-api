docs: |-
  # Rotate Key

  `POST {{base_url}}/api/v1/vaults/{{vault_name}}/keys/{{key_id}}/rotate`

  Rotates the key to a new version. The previous version stays available.

  ## Requires
  - `key_id`.

  ## Auth
  Bearer `{{token}}`.

  No body.

  ## Notes
  - To rotate automatically, configure a policy with Upsert Key Rotation Policy.
