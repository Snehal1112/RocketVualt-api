docs: |-
  # Upsert Key Rotation Policy

  `PUT {{base_url}}/api/v1/vaults/{{vault_name}}/keys/{{key_id}}/rotationpolicy`

  Creates or replaces the rotation policy of a key.

  ## Requires
  - `key_id`.

  ## Auth
  Bearer `{{token}}`.

  ## Body (JSON)
  - `rotate_after_days` (number): rotate the key after this many days. Example: `90`.
  - `notify_before_expiry_days` (number): send a notice this many days before expiry. Example: `30`.
  - `expiry_days` (number): key lifetime in days. Example: `365`.
  - `enabled` (boolean): turn the policy on or off.

  ```json
  {
    "rotate_after_days": 90,
    "notify_before_expiry_days": 30,
    "expiry_days": 365,
    "enabled": true
  }
  ```
