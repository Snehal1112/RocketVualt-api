docs: |-
  ## Upsert Key Rotation Policy

  Creates or replaces the automatic rotation policy of a key.

  | Field | Value |
  | --- | --- |
  | Method | `PUT` |
  | Path | `/api/v1/vaults/{vault_name}/keys/{key_id}/rotationpolicy` |
  | Auth | Requires a valid bearer token and a role assignment in this vault that grants the matching data action. The global `admin` role does not bypass this check. |

  **Parameters**

  - `vault_name` (path): Name of the vault.
  - `key_id` (path): UUID of the key.

  **Request body**

  ```json
  {
    "rotate_after_days": 90,
    "notify_before_expiry_days": 30,
    "expiry_days": 365,
    "enabled": true
  }
  ```
