docs: |-
  # Encrypt Key

  `POST {{base_url}}/api/v1/vaults/{{vault_name}}/keys/{{key_id}}/encrypt`

  Encrypts data with the key.

  ## Requires
  - `key_id`.

  ## Auth
  This request is set to **no auth**, unlike the other keys requests (Bearer `{{token}}`). If the server returns 401, change the auth to Bearer `{{token}}`.

  ## Body (JSON)
  - `value` (string): base64-encoded plaintext.
  - `algorithm` (string): the example uses `RSA-OAEP`.

  ```json
  {
    "value": "<base64-encoded-plaintext>",
    "algorithm": "RSA-OAEP"
  }
  ```
