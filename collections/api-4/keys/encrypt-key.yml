info:
  name: Encrypt Key
  type: http
  seq: 12
http:
  method: POST
  url: '{{base_url}}/api/v1/vaults/{{vault_name}}/keys/{{key_id}}/encrypt'
  body:
    type: json
    data: |-
      {
        "value": "<base64-encoded-plaintext>",
        "algorithm": "RSA-OAEP"
      }
  auth:
    type: bearer
    token: '{{token}}'
