docs: |-
  ## Encrypt Key

  Encrypts a value with a key stored in a vault. Send the plaintext as base64, and the server returns the encrypted result. Use the matching decrypt endpoint (`keys/decrypt-key.yml`) to reverse it.

  ### When to use

  Use this when an app needs to protect a value, such as a customer ID or a config secret, before storing it.

  ### Quick start

  1. Base64-encode the plaintext. For example, `hello` becomes `aGVsbG8=`.
  2. Set `vault_name` and `key_id` in the environment (or the URL).
  3. Send the request with a bearer token. Your role must grant encrypt permission in this vault.

  | Field | Value |
  | --- | --- |
  | Method | `POST` |
  | Path | `/api/v1/vaults/{vault_name}/keys/{key_id}/encrypt` |
  | Auth | Bearer token, plus a role assignment in this vault that grants the matching data action. The global `admin` role does not bypass this check. |

  ### Path parameters

  - `vault_name`: Name of the vault that holds the key.
  - `key_id`: UUID of the key to encrypt with.

  ### Request body

  - `value` (string, required): The plaintext to encrypt, base64-encoded.
  - `algorithm` (string, required): The encryption algorithm. This request uses `RSA-OAEP`.

  ```json
  {
    "value": "<base64-encoded-plaintext>",
    "algorithm": "RSA-OAEP"
  }
  ```

  ### Common errors

  - **403 Forbidden**: The caller has no role assignment in this vault for encrypt actions. Assigning a global `admin` role is not enough.
  - **404 Not Found**: The vault or key does not exist, or `key_id` is not a valid key in this vault.
