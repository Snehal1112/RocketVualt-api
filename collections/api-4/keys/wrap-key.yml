docs: |-
  # Wrap Key

  `POST {{base_url}}/api/v1/vaults/{{vault_name}}/keys/{{key_id}}/wrap`

  Wraps (encrypts) key material with the key, for example to move a key securely to another system.

  ## Requires
  - `key_id`: the wrapping key.

  ## Auth
  Bearer `{{token}}`.

  ## Body (JSON)
  - `plaintext_key` (string): base64-encoded key material to wrap.
  - `algorithm` (string): the example uses `RSA-OAEP`.

  Use Unwrap Key to reverse this.
