http:
  method: POST
  url: '{{base_url}}/api/v1/vaults/{{vault_name}}/keys/{{key_id}}/sign'
  body:
    type: json
    data: |-
      {
        "value": "<base64-encoded-data-to-sign>",
        "algorithm": "RS256"
      }
  auth:
    type: bearer
    token: '{{token}}'
docs: |-
  # Sign Key

  `POST {{base_url}}/api/v1/vaults/{{vault_name}}/keys/{{key_id}}/sign`

  Signs data with the key.

  ## Requires
  - `key_id`.

  ## Auth
  Bearer `{{token}}`.

  ## Body (JSON)
  - `value` (string): base64-encoded data to sign.
  - `algorithm` (string): the example uses `RS256`.

  The response contains the signature. Pass it to Verify Key.
