docs: |-
  # Import Key

  `POST {{base_url}}/api/v1/vaults/{{vault_name}}/keys/import`

  Imports an existing key into the vault as a JSON Web Key (JWK).

  ## Auth
  Bearer `{{token}}`.

  ## Body (JSON)
  - `name` (string): name of the imported key.
  - `jwk` (object): the key in JWK form. For RSA, the fields are `kty` (`RSA`), `n` (modulus), and `e` (exponent).
  - `tags` (string[]): optional labels.

  The example `n` value is a sample. Replace it with your own key before use.

  ## Notes
  - The example contains only public key fields (`kty`, `n`, `e`).
  - The response format is not documented in the collection.
