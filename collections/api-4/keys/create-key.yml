docs: |-
  # Create Key

  `POST {{base_url}}/api/v1/vaults/{{vault_name}}/keys`

  Creates a new key in the vault.

  ## Auth
  Bearer `{{token}}`.

  ## Body (JSON)
  - `name` (string): display name of the key.
  - `type` (string): key type. The example uses `RSA`.
  - `bits` (number): key size for RSA. The example uses `2048`.
  - `tags` (string[]): labels, such as `env:dev`.

  ```json
  {
    "name": "my-rsa-key",
    "type": "RSA",
    "bits": 2048,
    "tags": ["env:dev"]
  }
  ```

  ## Notes
  - The response format is not documented in the collection. Save the returned `id` to the `key_id` variable.
  - To bring in existing key material, use Import Key instead.
