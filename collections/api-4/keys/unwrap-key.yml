docs: |-
  # Unwrap Key

  `POST {{base_url}}/api/v1/vaults/{{vault_name}}/keys/{{key_id}}/unwrap`

  Unwraps (decrypts) key material that was wrapped with Wrap Key.

  ## Requires
  - `key_id`: the wrapping key used to wrap the material.

  ## Auth
  Bearer `{{token}}`.

  ## Body (JSON)
  - `wrapped_key` (string): base64-encoded wrapped bytes.
  - `algorithm` (string): the example uses `RSA-OAEP`.

  The response format is not documented in the collection.
