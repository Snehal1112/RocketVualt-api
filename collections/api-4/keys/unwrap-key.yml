docs: |-
  ## Unwrap Key

  Unwraps key material that was wrapped with this key.

  | Field | Value |
  | --- | --- |
  | Method | `POST` |
  | Path | `/api/v1/vaults/{vault_name}/keys/{key_id}/unwrap` |
  | Auth | Requires a valid bearer token and a role assignment in this vault that grants the matching data action. The global `admin` role does not bypass this check. |

  **Parameters**

  - `vault_name` (path): Name of the vault.
  - `key_id` (path): UUID of the key.

  **Request body**

  ```json
  {
    "wrapped_key": "<base64-encoded-wrapped-bytes>",
    "algorithm": "RSA-OAEP"
  }
  ```
