docs: |-
  ## Create User

  Creates a user.

  | Field | Value |
  | --- | --- |
  | Method | `POST` |
  | Path | `/api/v1/users` |
  | Auth | Requires a valid bearer token with the global `admin` role. |

  **Request body**

  ```json
  {
    "username": "numericlabs-admin",
    "password": "Snehal@1977",
    "roles": ["admin"]
  }
  ```

  **Notes**

  The `roles` field sets the global roles of the new user.
