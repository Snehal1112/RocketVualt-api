  ## List Users

  Lists users.

  | Field | Value |
  | --- | --- |
  | Method | `GET` |
  | Path | `/api/v1/users?page=0&per_page=20` |
  | Auth | Requires a valid bearer token with the global `admin` role. |

  **Parameters**

  - `page` (query): Page number, starting from `0`.
  - `per_page` (query): Number of items per page.
