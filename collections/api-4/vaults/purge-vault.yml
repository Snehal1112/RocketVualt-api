docs: |-
  ## Purge Vault (Permanent Delete)

  Permanently deletes a soft-deleted vault and everything in it.

  | Field | Value |
  | --- | --- |
  | Method | `DELETE` |
  | Path | `/api/v1/vaults/{vault_name}/purge` |
  | Auth | Requires a valid bearer token with vault management rights for this vault (a vault-scoped `vaults:manage` grant or the `Key Vault Administrator` role). |

  **Parameters**

  - `vault_name` (path): Name of the vault.

  **Notes**

  This cannot be undone. Purge protection can block the request.
