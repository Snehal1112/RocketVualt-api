docs: |-
  ## Create Vault

  Creates a vault.

  | Field | Value |
  | --- | --- |
  | Method | `POST` |
  | Path | `/api/v1/vaults` |
  | Auth | Requires a valid bearer token. Creating a vault needs a global grant or a vault provisioning grant. |

  **Request body**

  ```json
  {
    "name": "numericlabs-api-vault",
    "enabled": true,
    "purge_protection": false,
    "retention_days": 90,
    "tags": {
      "env": "dev"
    }
  }
  ```

  **Notes**

  A non-admin creator receives management rights over the new vault.
