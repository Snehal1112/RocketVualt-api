docs: |-
  ## Delete Vault Provisioning Grant

  Removes a principal's vault provisioning grant.

  | Field | Value |
  | --- | --- |
  | Method | `DELETE` |
  | Path | `/api/v1/vault-provisioning-grants/{principal_id}` |
  | Auth | Requires a valid bearer token with the global `admin` role. |

  **Parameters**

  - `principal_id` (path): UUID of the principal (a user or a service account).

  **Notes**

  The principal can no longer create vaults under this grant.
