uid: acc684c5-2e7a-4742-a309-659985bcea0f
info:
  name: OIDC CLI Exchange
  type: http
  seq: 3
http:
  method: POST
  url: '{{base_url}}/api/v1/oidc/cli/exchange'
  body:
    type: json
    data: |-
      {
        "code": "{{oidc_cli_code}}"
      }
runtime:
  scripts:
  - type: after-response
    code: |-
      const res = bru.response.getBody();
      if (res && res.token) {
        bru.setEnvVar("token", res.token);
        console.log("Token captured successfully");
      }
