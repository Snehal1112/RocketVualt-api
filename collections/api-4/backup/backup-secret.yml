docs: |-
  ## Backup Secret

  Creates a backup of a secret that can later be restored.

  | Field | Value |
  | --- | --- |
  | Method | `POST` |
  | Path | `/api/v1/secrets/{secret_id}/backup` |
  | Auth | Requires a valid bearer token and a role assignment in this vault that grants the matching data action. The global `admin` role does not bypass this check. |

  **Parameters**

  - `secret_id` (path): UUID of the secret.
