docs: |-
  ## Create Certificate (CA-Signed)

  Creates a certificate signed by a CA certificate and its key.

  | Field | Value |
  | --- | --- |
  | Method | `POST` |
  | Path | `/api/v1/vaults/{vault_name}/certificates` |
  | Auth | Requires a valid bearer token and a role assignment in this vault that grants the matching data action. The global `admin` role does not bypass this check. |

  **Parameters**

  - `vault_name` (path): Name of the vault.

  **Request body**

  ```json
  {
    "name": "my-ca-signed-cert",
    "key_id": "{{key_id}}",
    "ca_cert_id": "{{ca_cert_id}}",
    "validity_days": 365,
    "auto_renew": true,
    "renewal_days": 30,
    "tags": ["env:dev"]
  }
  ```

  **Notes**

  The signing key and the CA certificate must both belong to this vault.
