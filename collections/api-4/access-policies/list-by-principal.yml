    token: '{{token}}'
docs: |-
  ## List Policies by Principal

  Lists the access policies that apply to one principal in this vault.

  | Field | Value |
  | --- | --- |
  | Method | `GET` |
  | Path | `/api/v1/vaults/{vault_name}/access-policies/principal/{principal_id}` |
  | Auth | Requires a valid bearer token with the global `admin` role. |

  **Parameters**

  - `vault_name` (path): Name of the vault.
  - `principal_id` (path): UUID of the principal (a user or a service account).
