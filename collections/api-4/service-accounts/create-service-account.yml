uid: 670bc9ef-f51a-49e9-89cf-e57cb377e533
info:
  name: Create Service Account
  type: http
http:
  method: POST
  url: '{{base_url}}/api/v1/service-accounts'
  body:
    type: json
    data: |-
      {
        "name": "numericlabs-serviceaccount",
        "description": "Numericlabs M2M token"
      }
  auth:
    type: bearer
    token: '{{token}}'
runtime:
  scripts:
  - type: after-response
    code: |-
      /**
       * {
        "client_secret": "31c2aacac967da255aed1f716c84977788c20100b43062b488b35044bf6699ca",
        "created_at": "2026-09-22T16:22:28.018209002Z",
        "description": "CI/CD pipeline service account",
        "enabled": true,
        "expires_at": null,
        "id": "5ddc7369-e6af-4bfa-88e8-8a44b6faadfc",
        "name": "rocketvault-serviceaccount"
      }
       */
      const body = res.getBody();
      console.log(body);

      rok.setVar("service_account_id", body.id);

      rok.setCollectionVar("service_account_id", body.id);
      rok.setCollectionVar("client_secret", body.client_secret);
  - type: tests
    code: |2-

      test("Status is 200", () => {
        console.log(rok.getVar("service_account_id"), "service_account_id");
        expect(res.getStatus()).to.equal(201);
      });
  assertions:
  - expression: res.body.client_secret
    operator: isDefined
    value: ''
settings:
  encodeUrl: true
  timeout: 0.0
  followRedirects: true
  maxRedirects: 5.0
  verifySsl: true
docs: |-
  ## Create Service Account

  Creates a service account for machine-to-machine access.

  | Field | Value |
  | --- | --- |
  | Method | `POST` |
  | Path | `/api/v1/service-accounts` |
  | Auth | Requires a valid bearer token with the global `admin` role. |

  **Request body**

  ```json
  {
    "name": "numericlabs-serviceaccount",
    "description": "Numericlabs M2M token"
  }
  ```

  **Notes**

  Use the returned client credentials with the OAuth2 token endpoint.
