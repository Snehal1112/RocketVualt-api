docs: |-
  ## Get Service Account

  Returns a service account's details.

  | Field | Value |
  | --- | --- |
  | Method | `GET` |
  | Path | `/api/v1/service-accounts/{service_account_id}` |
  | Auth | Requires a valid bearer token with the global `admin` role. |

  **Parameters**

  - `service_account_id` (path): UUID of the service account.
