uid: e8a9ef6c-bdf8-4b4b-aab6-288002570a25
info:
  name: Rotate Service Account Secret
  type: http
http:
  method: POST
  url: '{{base_url}}/api/v1/service-accounts/{{service_account_id}}/rotate'
runtime:
  scripts:
  - type: after-response
    code: |-
      const body = res.getBody();
      console.log("service-accounts-rotate-body:-", body);
      rok.setCollectionVar("client_secret", body.client_secret);
  - type: tests
    code: |2-

      test("Body is not empty", () => {
        expect(res.getBody()).to.not.be.empty;
      });

      test("Status is 2xx", () => {
        expect(res.getStatus()).to.be.within(200, 299);
      });
settings:
  encodeUrl: true
  timeout: 0.0
  followRedirects: true
  maxRedirects: 5.0
  verifySsl: true
docs: |-
  ## Rotate Service Account Secret

  Generates a new client secret for a service account.

  | Field | Value |
  | --- | --- |
  | Method | `POST` |
  | Path | `/api/v1/service-accounts/{service_account_id}/rotate` |
  | Auth | Requires a valid bearer token with the global `admin` role. |

  **Parameters**

  - `service_account_id` (path): UUID of the service account.

  **Notes**

  Update any clients that use the old secret.
