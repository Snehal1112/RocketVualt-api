docs: |-
  ## Readiness Check

  Readiness probe. Reports whether the server can accept traffic.

  | Field | Value |
  | --- | --- |
  | Method | `GET` |
  | Path | `/api/v1/health/ready` |
  | Auth | None. This endpoint is public. |

  ### Response (200 OK)

  ```json
  {
    "status": "ready"
  }
  ```

  | Field | Description |
  | --- | --- |
  | `status` | `ready` when the server can accept traffic. |

  ### Errors

  | Status | Meaning |
  | --- | --- |
  | `503 Service Unavailable` | The health metrics could not be collected. The body is `{"status": "not ready"}`. |

  ### Notes

  - **What it tests.** The check succeeds if the server can collect its health metrics. That collection reads Go runtime statistics and the database connection pool counters. It does not run a query against the database.
  - **Use.** Load balancer routing checks.
