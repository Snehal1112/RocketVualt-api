uid: 319907eb-9c54-4a0f-a4ed-9432c331c39d
info:
  name: Create Secret
  type: http
http:
  method: POST
  url: '{{base_url}}/api/v1/vaults/{{vault_name}}/secrets'
  body:
    type: json
    data: |-
      {
        "name": "my-secret",
        "value": "s3cr3t-value",
        "tags": ["env:dev", "team:backend"],
        "content_type": "text/plain",
        "vault":"my-vault"
      }
  auth:
    type: bearer
    token: '{{token}}'
settings:
  encodeUrl: true
  timeout: 0.0
  followRedirects: true
  maxRedirects: 5.0
  verifySsl: true
