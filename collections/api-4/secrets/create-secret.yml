docs: |-
  # Create Secret

  Creates a secret in a vault and writes its first version.

  **Request:** `POST {{base_url}}/api/v1/vaults/{{vault_name}}/secrets`
  **Auth:** Inherited from the folder or collection (bearer token from `{{token}}`).

  ## Authorization

  The caller needs a valid bearer token and a role assignment in this vault that grants the matching data action. The global `admin` role does not bypass this check.

  ## Parameters

  | Name | In | Type | Required | Description |
  |---|---|---|---|---|
  | `vault_name` | path | string | yes | Name of the vault. The request uses `{{vault_name}}`, which is `rocket-api-vault` in the `local` environment. |
  | `name` | body | string | yes | Name of the secret to create. |
  | `value` | body | string | yes | Secret value. It is stored as the first version. |
  | `tags` | body | string[] | no | Labels in `key:value` form, such as `env:dev`. |
  | `content_type` | body | string | no | MIME type of the value, such as `text/plain`. |
  | `vault` | body | string | no* | Vault name carried in the body. See the note below. |

  \* The endpoint identifies the vault from the path, so the body `vault` field is probably unnecessary. The documentation does not say whether it is read or ignored.

  ## Request body

  ```json
  {
    "name": "numericlabs-local-admin",
    "value": "<secret value>",
    "tags": ["env:dev", "team:backend", "team:local"],
    "content_type": "text/plain",
    "vault": "numericlabs-api-vault"
  }
  ```

  ## Example response

  The collection can't be run from here, so this is an illustrative `201 Created` response. The field names are assumed, not taken from a real run.

  ```json
  {
    "id": "5b1e0c7a-3f2d-4e8a-9c61-2a7d9f4e1b30",
    "name": "numericlabs-local-admin",
    "vault": "rocket-api-vault",
    "content_type": "text/plain",
    "tags": ["env:dev", "team:backend", "team:local"],
    "version": {
      "id": "a0c4d2e8-71b5-4f9a-8e3d-6c2b1f0a9d47",
      "number": 1,
      "created_at": "2026-10-10T09:15:00Z"
    },
    "created_at": "2026-10-10T09:15:00Z"
  }
  ```

  The response is not returned with the secret value, so the value should not appear in it. Check this against a real response before relying on it.

  ## Errors

  - **401 Unauthorized:** the bearer token is missing, expired, or invalid.
  - **403 Forbidden:** the caller has no role assignment in the vault that grants the data action. Being `admin` globally is not enough.
  - **404 Not Found:** the vault in the path does not exist.
  - **409 Conflict:** a secret with this name probably already exists. The docs do not list this case, so it is an assumption.
