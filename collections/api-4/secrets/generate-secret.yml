uid: 3b0eb6a0-6975-4972-89bb-c063ed52fe6d
info:
  name: Generate Secret
  type: http
  seq: 6
http:
  method: POST
  url: '{{base_url}}/api/v1/vaults/{{vault_name}}/secrets/generate'
  body:
    type: json
    data: |-
      {
        "name": "generated-password",
        "length": 24,
        "use_symbols": true,
        "use_numbers": true,
        "use_uppercase": true,
        "use_lowercase": true
      }
  auth:
    type: bearer
    token: '{{token}}'
