docs: |-
  ## Generate Secret

  Generates a random secret value on the server and stores it.

  | Field | Value |
  | --- | --- |
  | Method | `POST` |
  | Path | `/api/v1/vaults/{vault_name}/secrets/generate` |
  | Auth | Requires a valid bearer token and a role assignment in this vault that grants the matching data action. The global `admin` role does not bypass this check. |

  **Parameters**

  - `vault_name` (path): Name of the vault.

  **Request body**

  ```json
  {
    "name": "generated-password",
    "length": 24,
    "use_symbols": true,
    "use_numbers": true,
    "use_uppercase": true,
    "use_lowercase": true
  }
  ```
