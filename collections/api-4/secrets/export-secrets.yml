docs: |-
  ## Export Secrets

  Exports secrets from this vault in encrypted form.

  | Field | Value |
  | --- | --- |
  | Method | `POST` |
  | Path | `/api/v1/vaults/{vault_name}/secrets/export` |
  | Auth | Requires a valid bearer token and a role assignment in this vault that grants the matching data action. The global `admin` role does not bypass this check. |

  **Parameters**

  - `vault_name` (path): Name of the vault.

  **Request body**

  ```json
  {
    "format": "json",
    "encrypt": false,
    "include_tags": true,
    "tags": []
  }
  ```
