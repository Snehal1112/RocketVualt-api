docs: |-
  ## Get Secret Version

  Returns one version of a secret.

  | Field | Value |
  | --- | --- |
  | Method | `GET` |
  | Path | `/api/v1/vaults/{vault_name}/secrets/{secret_id}/versions/{version}` |
  | Auth | Requires a valid bearer token and a role assignment in this vault that grants the matching data action. The global `admin` role does not bypass this check. |

  **Parameters**

  - `vault_name` (path): Name of the vault.
  - `secret_id` (path): UUID of the secret.
  - `version` (path): Version number.

  **Notes**

  The response contains the secret value.
