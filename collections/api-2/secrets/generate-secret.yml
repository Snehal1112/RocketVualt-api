uid: 46228df5-2b3f-4173-a1a9-832a5e0852d5
info:
  name: Generate Secret
  type: http
  seq: 6
http:
  method: POST
  url: '{{base_url}}/api/v1/vaults/{{vault_name}}/secrets/generate'
  body:
    type: json
    data: |-
      {
        "name": "generated-password",
        "length": 24,
        "use_symbols": true,
        "use_numbers": true,
        "use_uppercase": true,
        "use_lowercase": true
      }
  auth:
    type: bearer
    token: '{{token}}'
