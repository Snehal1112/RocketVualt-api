uid: 83d557c4-5296-4fea-bccb-4bf8313402a5
info:
  name: Create Certificate
  type: http
  seq: 3
http:
  method: POST
  url: '{{base_url}}/api/v1/vaults/{{vault_name}}/certificates'
  body:
    type: json
    data: |-
      {
        "name": "my-cert",
        "key_id": "{{key_id}}",
        "validity_days": 365,
        "auto_renew": true,
        "renewal_days": 30,
        "tags": ["env:dev"]
      }
  auth:
    type: bearer
    token: '{{token}}'
