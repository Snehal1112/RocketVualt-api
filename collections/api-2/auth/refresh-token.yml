uid: ccd9f2e8-2020-4538-9f0f-89d483807ad1
info:
  name: Refresh Token
  type: http
  seq: 2
http:
  method: POST
  url: '{{base_url}}/api/v1/users/refresh'
  body:
    type: json
    data: |-
      {
        "refresh_token": "{{refresh_token}}"
      }
runtime:
  scripts:
  - type: after-response
    code: |-
      const res = bru.response.getBody();
      if (res && res.token) {
        bru.setEnvVar("token", res.token);
        console.log("Token refreshed successfully");
      }
