info:
  name: Login
  type: http
http:
  method: POST
  url: '{{base_url}}/api/v1/users/login'
  body:
    type: json
    data: |-
      {
        "username": "{{username}}",
        "password": "{{password}}",
        "totp_code": "{{totp_code}}"
      }
runtime:
  scripts:
  - type: after-response
    code: |-
      console.log("sdddddd");
      res = rok.getBody();
      console.log("RES:-", res);
      if (res && res.token) {
        bru.setEnvVar("token", res.token);
        console.log("Token captured successfully");
      }
settings:
  encodeUrl: true
  timeout: 0.0
  followRedirects: true
  maxRedirects: 5.0
  verifySsl: true
