uid: dce2ead8-6b67-4b9b-a7ef-4a0b8b02508d
info:
  name: Create Access Policy
  type: http
  seq: 3
http:
  method: POST
  url: '{{base_url}}/api/v1/vaults/{{vault_name}}/access-policies'
  body:
    type: json
    data: |-
      {
        "principal_id": "{{user_id}}",
        "principal_type": "user",
        "resource_type": "secrets",
        "operation": "get",
        "effect": "allow"
      }
  auth:
    type: bearer
    token: '{{token}}'
