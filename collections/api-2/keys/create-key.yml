uid: 33acb011-33fd-45b2-bff4-f5a2361db6cf
info:
  name: Create Key
  type: http
  seq: 3
http:
  method: POST
  url: '{{base_url}}/api/v1/vaults/{{vault_name}}/keys'
  body:
    type: json
    data: |-
      {
        "name": "my-rsa-key",
        "type": "RSA",
        "bits": 2048,
        "tags": ["env:dev"]
      }
  auth:
    type: bearer
    token: '{{token}}'
