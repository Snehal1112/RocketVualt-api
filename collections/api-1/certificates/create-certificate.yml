uid: 7d849911-3e05-4bb1-8f81-9a928426e4a5
info:
  name: Create Certificate
  type: http
  seq: 3
http:
  method: POST
  url: '{{base_url}}/api/v1/certificates'
  body:
    type: json
    data: |-
      {
        "name": "my-cert",
        "key_id": "{{key_id}}",
        "validity_days": 365,
        "auto_renew": true,
        "renewal_days": 30,
        "tags": ["env:dev"]
      }
  auth:
    type: bearer
    token: '{{token}}'
