uid: 7c9e50b1-7009-4add-bd1a-cae125022747
info:
  name: Login
  type: http
http:
  method: POST
  url: '{{base_url}}/api/v1/users/login'
  body:
    type: json
    data: |-
      {
        "username": "{{username}}",
        "password": "{{password}}",
        "totp_code": "{{totp_code}}"
      }
runtime:
  scripts:
  - type: after-response
    code: |-
      rok.setGlobalEnvVar("g-key", "snehal")
      console.log("Env:", rok.getEnvName());
      console.log("Res:-", res.getBody());
      const value = res.getBody().request_id;
      rok.setEnvVar("key", value);
      console.log("Value:-",value)
      rok.setEnvVar("key-1", value, { persist: true })
      console.log("Value-1:-",value)
settings:
  encodeUrl: true
  timeout: 0.0
  followRedirects: true
  maxRedirects: 5.0
  verifySsl: true
