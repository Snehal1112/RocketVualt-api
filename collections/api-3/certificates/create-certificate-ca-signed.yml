uid: 6e26176c-5473-40cd-a6f3-1197043fb8ea
info:
  name: Create Certificate (CA-Signed)
  type: http
  seq: 9
http:
  method: POST
  url: '{{base_url}}/api/v1/vaults/{{vault_name}}/certificates'
  body:
    type: json
    data: |-
      {
        "name": "my-ca-signed-cert",
        "key_id": "{{key_id}}",
        "ca_cert_id": "{{ca_cert_id}}",
        "validity_days": 365,
        "auto_renew": true,
        "renewal_days": 30,
        "tags": ["env:dev"]
      }
  auth:
    type: bearer
    token: '{{token}}'
