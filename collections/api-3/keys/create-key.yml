info:
  name: Create Key
  type: http
  seq: 3
http:
  method: POST
  url: '{{base_url}}/api/v1/vaults/{{vault_name}}/keys'
  body:
    type: json
    data: |-
      {
        "name": "my-rsa-key",
        "type": "RSA",
        "bits": 2048,
        "tags": ["env:dev"]
      }
  auth:
    type: bearer
    token: '{{token}}'
