uid: d0afa639-17d5-469f-b48a-c368107456e6
info:
  name: Sign Key
  type: http
  seq: 10
http:
  method: POST
  url: '{{base_url}}/api/v1/vaults/{{vault_name}}/keys/{{key_id}}/sign'
  body:
    type: json
    data: |-
      {
        "value": "<base64-encoded-data-to-sign>",
        "algorithm": "RS256"
      }
  auth:
    type: bearer
    token: '{{token}}'
