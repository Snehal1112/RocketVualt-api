uid: a0882db9-240b-418f-b74a-f14e90876c55
info:
  name: Verify Key
  type: http
  seq: 11
http:
  method: POST
  url: '{{base_url}}/api/v1/vaults/{{vault_name}}/keys/{{key_id}}/verify'
  body:
    type: json
    data: |-
      {
        "value": "<base64-encoded-original-data>",
        "signature": "<base64-encoded-signature>",
        "algorithm": "RS256"
      }
  auth:
    type: bearer
    token: '{{token}}'
