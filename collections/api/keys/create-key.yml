uid: 8834245f-12a9-4dc6-8dec-31b54ad4e227
info:
  name: Create Key
  type: http
http:
  method: POST
  url: '{{base_url}}/api/v1/keys'
  body:
    type: json
    data: |-
      {
        "name": "my-rsa-key",
        "type": "RSA",
        "bits": 2048,
        "tags": ["env:dev"]
      }
  auth:
    type: bearer
    token: '{{token}}'
settings:
  encodeUrl: true
  timeout: 0.0
  followRedirects: true
  maxRedirects: 5.0
  verifySsl: true
